<!doctype html><html lang="en"><meta charset="utf-8"><title>Office controls qualification</title>
<style>
body{font:18px system-ui;background:#edf2f7;color:#162c42;margin:32px}
main{max-width:900px;margin:auto}button,input{font:inherit;padding:12px;margin:12px 0}
#surface{display:block;width:650px;height:160px;background:#b7d3f8;touch-action:none;user-select:none;border:2px solid #397dc4}
label{display:block}input{width:620px}#status{font-variant-numeric:tabular-nums}
</style>
<main><h1>Office controls qualification</h1><p>Synthetic input contract check. No network requests.</p>
<button id="surface" type="button" aria-label="Drag surface">Drag within this rectangle</button>
<label for="text">Keyboard check</label><input id="text" value="alpha beta gamma" autocomplete="off">
<p id="status" role="status">Recorded events: 0</p><button id="export">Save control evidence</button></main>
<script>
const events=[],status=document.getElementById('status');
for(const kind of ['pointerdown','pointermove','pointerup','keydown','keyup']){
window.addEventListener(kind,e=>{
  if(kind==='pointermove'&&!e.buttons)return;
  events.push({kind,target:e.target.id,key:e.key||null,x:e.clientX??null,y:e.clientY??null,
    buttons:e.buttons??null,shift:e.shiftKey,ctrl:e.ctrlKey,alt:e.altKey,time:e.timeStamp});
  status.textContent='Recorded events: '+events.length;
});}
document.getElementById('export').addEventListener('click',()=>{
  const run=new URLSearchParams(location.search).get('run');
  if(!/^[a-zA-Z0-9_-]{1,40}$/.test(run))throw Error('Missing test run identity');
  const link=document.createElement('a');link.download='office-controls-'+run+'.json';
  const url=URL.createObjectURL(new Blob([JSON.stringify({run,events,text:document.getElementById('text').value})],{type:'application/json'}));
  link.href=url;link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
});
</script></html>
