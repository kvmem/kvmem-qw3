<!doctype html>
<html lang="en">
<meta charset="utf-8"><title>Local desktop test · Request form</title>
<style>
body{font:18px system-ui;background:#edf2f7;color:#14283e;margin:0;padding:48px}
main{max-width:680px;margin:auto;background:white;padding:36px;border-radius:16px;box-shadow:0 8px 32px #18314b12}
h1{font-size:28px;margin:0 0 10px}p{line-height:1.5;color:#526273}label{display:block;margin:22px 0 8px;font-weight:600}
input[type=text],select{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #abb9c7;border-radius:6px}
button{font:600 18px system-ui;border:0;border-radius:7px;background:#175cd3;color:white;padding:13px 22px;margin-top:24px;cursor:pointer}
#status{min-height:28px;color:#087347}code{font:20px ui-monospace;padding:6px;background:#eff3f8;user-select:all}
</style>
<main><h1>Request form</h1><p>This page works offline. Complete the fields and save the request as a JSON file.</p>
<form id="form">
<label for="name">Name</label><input id="name" name="name" type="text" autocomplete="off" required>
<label for="reference">Reference</label><input id="reference" name="reference" type="text" autocomplete="off" required>
<label for="priority">Priority</label><select id="priority" name="priority"><option>Normal</option><option>High</option><option>Low</option></select>
<label><input id="confirmed" type="checkbox" required> I have checked the information</label>
<button type="submit">Save request</button><p id="status" role="status"></p>
</form><hr><p>Reference for the copy task: <code id="copy-reference">QW3-WINDOWS-2026-ALPHA</code></p>
</main>
<script>
document.querySelector('#form').addEventListener('submit',event=>{
 event.preventDefault();const result={name:document.querySelector('#name').value,reference:document.querySelector('#reference').value,priority:document.querySelector('#priority').value,confirmed:document.querySelector('#confirmed').checked};
 const link=document.createElement('a');link.download='browser-result.json';const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));link.href=url;link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
 document.querySelector('#status').textContent='Saved browser-result.json';
});
</script>
</html>
