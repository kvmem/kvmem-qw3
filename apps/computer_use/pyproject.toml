[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qw3-computer"
version = "0.1.0"
description = "Local Codex provider and desktop application for QW3"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.0", "Pillow>=10,<13", "certifi==2026.7.22"]

[project.optional-dependencies]
test = ["jsonschema==4.25.1"]

[project.scripts]
qw3-responses = "qw3_computer.bridge:main"
qw3-computer = "qw3_computer.app:main"
qw3-device = "qw3_computer.device_gateway:main"

[tool.setuptools.packages.find]
include = ["qw3_computer*"]

[tool.setuptools.package-data]
qw3_computer = ["ui.html", "software_catalog.json", "latex_catalog.json", "latex_example.tex"]
