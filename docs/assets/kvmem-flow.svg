<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
     viewBox="0 0 1200 630" role="img"
     aria-labelledby="kvmem-flow-title kvmem-flow-desc">
  <title id="kvmem-flow-title">Long history, bounded GPU working set</title>
  <desc id="kvmem-flow-desc">
    A four-step conceptual overview of KVMem. Historical model state remains
    recoverable across GPU and CPU tiers, with NVMe as an optional extension.
    A new question ranks an internal per-block Mean-K summary index. The
    top-ranked historical KV block is staged into a fixed-size GPU attention
    window while another block is staged out. The model then generates with the
    refreshed context. Mandatory kept regions, the short internal query-state
    rebuild, and position remapping are intentionally omitted for readability.
    The animation loops continuously, with a short pause on its complete frame.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111e"/>
      <stop offset="1" stop-color="#0b1c2e"/>
    </linearGradient>
    <linearGradient id="answer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#143d3d"/>
      <stop offset="1" stop-color="#152f4e"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000814"
                    flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#65839a"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a797ff"/>
    </marker>
  </defs>

  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system,
           BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #f5f9fc; font-size: 30px; font-weight: 760; }
    .subtitle { fill: #a5bac9; font-size: 16px; }
    .heading { fill: #edf5fa; font-size: 18px; font-weight: 720; }
    .body { fill: #d8e6ee; font-size: 16px; }
    .small { fill: #a5bac9; font-size: 15px; }
    .micro { fill: #8ea6b7; font-size: 14px; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .panel { fill: #0c1d2d; stroke: #29465d; stroke-width: 1.2; }
    .block { fill: #142e42; stroke: #3c6078; stroke-width: 1.2; }
    .block-fact { fill: #49395f; stroke: #b9a8ff; stroke-width: 1.8; }
    .block-query { fill: #143d3d; stroke: #50dfc7; stroke-width: 1.7; }
    .tier-gpu { fill: #173d48; }
    .tier-cpu { fill: #1b3450; }
    .wire { fill: none; stroke: #65839a; stroke-width: 2.2;
            marker-end: url(#arrow); }
    .wire-accent { fill: none; stroke: #a797ff; stroke-width: 2.3;
                   marker-end: url(#arrow-accent); }
    .badge { fill: #66a3ff; }
    .focus-ring { fill: none; stroke: #66a3ff; stroke-width: 2.3;
                  opacity: 0; pointer-events: none; }
    .focus1 { animation: focus1 9s ease-in-out infinite; }
    .focus2 { animation: focus2 9s ease-in-out infinite; }
    .focus3 { animation: focus3 9s ease-in-out infinite; }
    .focus4 { animation: focus4 9s ease-in-out infinite; }
    .query-pulse { animation: queryPulse 9s ease-in-out infinite; }
    .fact-pulse { animation: factPulse 9s ease-in-out infinite; }
    .window-pulse { animation: windowPulse 9s ease-in-out infinite; }
    .answer-pulse { animation: answerPulse 9s ease-in-out infinite; }
    .stage-source { animation: stageSource 9s ease-in-out infinite; }
    .move-out { transform-box: fill-box; transform-origin: center;
                animation: stageOut 9s ease-in-out infinite; }
    .move-in { transform-box: fill-box; transform-origin: center;
               animation: stageIn 9s ease-in-out infinite; }

    @keyframes focus1 {
      0% { opacity: 0; } 3%, 19% { opacity: 0.9; }
      23%, 100% { opacity: 0; }
    }
    @keyframes focus2 {
      0%, 19% { opacity: 0; } 24%, 44% { opacity: 0.9; }
      49%, 100% { opacity: 0; }
    }
    @keyframes focus3 {
      0%, 43% { opacity: 0; } 49%, 70% { opacity: 0.9; }
      75%, 100% { opacity: 0; }
    }
    @keyframes focus4 {
      0%, 68% { opacity: 0; } 74%, 86% { opacity: 0.9; }
      90%, 100% { opacity: 0; }
    }
    @keyframes queryPulse {
      0%, 20%, 47%, 100% { filter: none; }
      27%, 43% { filter: url(#glow); }
    }
    @keyframes factPulse {
      0%, 30%, 73%, 100% { filter: none; }
      38%, 68% { filter: url(#glow); }
    }
    @keyframes windowPulse {
      0%, 47%, 75%, 100% { filter: none; }
      55%, 70% { filter: url(#glow); }
    }
    @keyframes answerPulse {
      0%, 72%, 100% { opacity: 0.65; }
      80%, 92% { opacity: 1; }
    }
    @keyframes stageSource {
      0%, 56% { opacity: 1; }
      57%, 100% { opacity: 0; }
    }
    @keyframes stageOut {
      0%, 48% { opacity: 0; transform: translate(0, 0); }
      51% { opacity: 1; transform: translate(0, 0); }
      57% { opacity: 1; transform: translate(0, 61px); }
      60%, 100% { opacity: 0; transform: translate(0, 61px); }
    }
    @keyframes stageIn {
      0%, 57% { opacity: 0; transform: translate(0, 0); }
      60% { opacity: 1; transform: translate(0, 0); }
      68% { opacity: 1; transform: translate(125px, -61px); }
      71%, 100% { opacity: 0; transform: translate(125px, -61px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .focus1, .focus2, .focus3, .focus4, .query-pulse, .fact-pulse,
      .window-pulse, .answer-pulse, .stage-source, .move-out, .move-in {
        animation: none !important;
      }
      .focus-ring, .move-out, .move-in { display: none; }
      .answer-pulse { opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="628" rx="24" fill="url(#bg)"
        stroke="#203c53" stroke-width="2"/>
  <text x="40" y="45" class="title">Long history. Small GPU working set.</text>
  <text x="40" y="72" class="subtitle">KVMem ranks history for each question and stages selected KV into a bounded GPU attention window.</text>

  <!-- 1. History is retained across tiers. -->
  <g filter="url(#soft)">
    <rect x="40" y="94" width="1120" height="146" rx="17" class="panel"/>
    <circle cx="64" cy="119" r="13" class="badge"/>
    <text x="64" y="124" text-anchor="middle" fill="#071528" font-size="13" font-weight="800">1</text>
    <text x="86" y="125" class="heading">History remains recoverable across memory tiers</text>
    <text x="1135" y="124" text-anchor="end" class="small">GPU active · CPU recoverable · NVMe optional</text>

    <g transform="translate(65 143)">
      <g>
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H0</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-cpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">CPU</text>
      </g>
      <g transform="translate(78 0)">
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H1</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-cpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">CPU</text>
      </g>
      <g transform="translate(156 0)">
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H2</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-cpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">CPU</text>
      </g>
      <g transform="translate(234 0)">
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H3</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-cpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">CPU</text>
      </g>
      <g transform="translate(312 0)" class="fact-pulse">
        <rect width="70" height="64" rx="8" class="block-fact"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H4</text>
        <text x="35" y="40" text-anchor="middle" fill="#ded5ff" font-size="14" font-weight="750">FACT</text>
        <rect y="47" width="70" height="17" class="tier-cpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">CPU</text>
      </g>
      <g transform="translate(390 0)">
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H5</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-cpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">CPU</text>
      </g>
      <g transform="translate(468 0)">
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H6</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-gpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">GPU</text>
      </g>
      <g transform="translate(546 0)">
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H7</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-gpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">GPU</text>
      </g>
      <g transform="translate(624 0)">
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H8</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-gpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">GPU</text>
      </g>
      <g transform="translate(702 0)">
        <rect width="70" height="64" rx="8" class="block"/>
        <text x="35" y="21" text-anchor="middle" class="small mono">H9</text>
        <text x="35" y="40" text-anchor="middle" class="micro">history</text>
        <rect y="47" width="70" height="17" class="tier-gpu"/>
        <text x="35" y="60" text-anchor="middle" class="micro">GPU</text>
      </g>
    </g>
    <text x="865" y="166" class="body">Many history blocks</text>
    <text x="865" y="190" class="body">Fixed active GPU slots</text>
    <text x="865" y="218" class="micro">Leaving GPU does not delete history.</text>
    <rect x="43" y="97" width="1114" height="140" rx="15" class="focus-ring focus1"/>
  </g>

  <!-- 2. The question ranks an internal block-summary index. -->
  <g filter="url(#soft)">
    <rect x="40" y="260" width="540" height="174" rx="17" class="panel"/>
    <circle cx="64" cy="285" r="13" class="badge"/>
    <text x="64" y="290" text-anchor="middle" fill="#071528" font-size="13" font-weight="800">2</text>
    <text x="86" y="291" class="heading">The question ranks history blocks</text>

    <g class="query-pulse">
      <rect x="65" y="314" width="168" height="58" rx="11" class="block-query"/>
      <text x="149" y="337" text-anchor="middle" class="small">new question</text>
      <text x="149" y="359" text-anchor="middle" fill="#8cebdc" font-size="16" font-weight="720">“Rollback code?”</text>
    </g>
    <path d="M235 343 L265 343" class="wire"/>

    <rect x="274" y="306" width="276" height="104" rx="12" fill="#102438" stroke="#3a5b71"/>
    <text x="292" y="328" class="small">internal Mean-K index</text>
    <g transform="translate(294 340)">
      <line x1="0" y1="39" x2="236" y2="39" stroke="#36546a"/>
      <g><rect y="29" width="20" height="10" rx="3" fill="#3c6078"/><text x="10" y="56" text-anchor="middle" class="micro mono">H0</text></g>
      <g transform="translate(30 0)"><rect y="25" width="20" height="14" rx="3" fill="#3c6078"/><text x="10" y="56" text-anchor="middle" class="micro mono">H1</text></g>
      <g transform="translate(60 0)"><rect y="31" width="20" height="8" rx="3" fill="#3c6078"/><text x="10" y="56" text-anchor="middle" class="micro mono">H2</text></g>
      <g transform="translate(90 0)"><rect y="22" width="20" height="17" rx="3" fill="#3c6078"/><text x="10" y="56" text-anchor="middle" class="micro mono">H3</text></g>
      <g transform="translate(120 0)" class="fact-pulse"><rect y="0" width="20" height="39" rx="3" fill="#a797ff"/><text x="10" y="56" text-anchor="middle" fill="#ded5ff" font-size="13" class="mono">H4</text></g>
      <g transform="translate(150 0)"><rect y="27" width="20" height="12" rx="3" fill="#3c6078"/><text x="10" y="56" text-anchor="middle" class="micro mono">H5</text></g>
      <g transform="translate(180 0)"><rect y="30" width="20" height="9" rx="3" fill="#3c6078"/><text x="10" y="56" text-anchor="middle" class="micro mono">H6</text></g>
      <g transform="translate(210 0)"><rect y="24" width="20" height="15" rx="3" fill="#3c6078"/><text x="10" y="56" text-anchor="middle" class="micro mono">H7</text></g>
    </g>
    <text x="65" y="421" class="micro">Ranks per-block KV summaries · no external vector database</text>
    <rect x="43" y="263" width="534" height="168" rx="15" class="focus-ring focus2"/>
  </g>

  <!-- 3. Stage selected KV into the fixed-size GPU window. -->
  <g filter="url(#soft)">
    <rect x="600" y="260" width="560" height="174" rx="17" class="panel"/>
    <circle cx="624" cy="285" r="13" class="badge"/>
    <text x="624" y="290" text-anchor="middle" fill="#071528" font-size="13" font-weight="800">3</text>
    <text x="646" y="291" class="heading">Swap selected KV into the fixed GPU window</text>

    <text x="625" y="317" class="small">before · 4 slots</text>
    <g transform="translate(625 327)">
      <rect width="45" height="42" rx="7" class="block"/><text x="22" y="26" text-anchor="middle" class="micro mono">H6</text>
      <rect x="52" width="45" height="42" rx="7" class="block"/><text x="74" y="26" text-anchor="middle" class="micro mono">H7</text>
      <rect x="104" width="45" height="42" rx="7" class="block"/><text x="126" y="26" text-anchor="middle" class="micro mono">H8</text>
      <rect x="156" width="45" height="42" rx="7" class="block"/><text x="178" y="26" text-anchor="middle" class="micro mono">H9</text>
    </g>
    <g transform="translate(625 327)"><g class="move-out">
      <rect width="45" height="42" rx="7" class="block"/>
      <text x="22" y="26" text-anchor="middle" class="micro mono">H6</text>
    </g></g>

    <path d="M837 348 L903 348" class="wire"/>
    <text x="849" y="335" class="micro">swap</text>

    <text x="915" y="317" class="small">after · 4 slots</text>
    <g transform="translate(915 327)" class="window-pulse">
      <rect width="45" height="42" rx="7" class="block-fact"/><text x="22" y="26" text-anchor="middle" fill="#ded5ff" font-size="13" class="mono">H4</text>
      <rect x="52" width="45" height="42" rx="7" class="block"/><text x="74" y="26" text-anchor="middle" class="micro mono">H7</text>
      <rect x="104" width="45" height="42" rx="7" class="block"/><text x="126" y="26" text-anchor="middle" class="micro mono">H8</text>
      <rect x="156" width="45" height="42" rx="7" class="block"/><text x="178" y="26" text-anchor="middle" class="micro mono">H9</text>
    </g>

    <path d="M647 371 L647 386" class="wire"/>
    <g transform="translate(625 388)">
      <rect width="76" height="28" rx="7" class="block"/>
      <text x="38" y="19" text-anchor="middle" class="micro mono">H6 · CPU</text>
    </g>
    <g transform="translate(790 388)">
      <g class="stage-source">
        <rect width="98" height="28" rx="7" class="block-fact"/>
        <text x="49" y="19" text-anchor="middle" fill="#ded5ff" font-size="12" class="mono">H4 FACT · CPU</text>
      </g>
      <g class="move-in">
        <rect width="45" height="28" rx="7" class="block-fact"/>
        <text x="22" y="19" text-anchor="middle" fill="#ded5ff" font-size="12" class="mono">H4</text>
      </g>
    </g>
    <path d="M889 401 C906 395 918 383 937 371" class="wire-accent"/>
    <text x="915" y="420" class="micro">Fixed size · history order preserved</text>
    <rect x="603" y="263" width="554" height="168" rx="15" class="focus-ring focus3"/>
  </g>

  <!-- 4. Generate with the refreshed context. -->
  <g filter="url(#soft)">
    <rect x="40" y="454" width="1120" height="106" rx="17" class="panel"/>
    <circle cx="64" cy="479" r="13" class="badge"/>
    <text x="64" y="484" text-anchor="middle" fill="#071528" font-size="13" font-weight="800">4</text>
    <text x="86" y="485" class="heading">Generate with the refreshed context</text>

    <rect x="324" y="496" width="150" height="43" rx="9" class="block-query query-pulse"/>
    <text x="399" y="523" text-anchor="middle" fill="#8cebdc" font-size="15" font-weight="700">same question</text>
    <text x="487" y="524" class="body">+</text>
    <g transform="translate(514 497)" class="window-pulse">
      <rect width="43" height="41" rx="7" class="block-fact"/><text x="21" y="25" text-anchor="middle" fill="#ded5ff" font-size="12" class="mono">H4</text>
      <rect x="49" width="43" height="41" rx="7" class="block"/><text x="70" y="25" text-anchor="middle" class="micro mono">H7</text>
      <rect x="98" width="43" height="41" rx="7" class="block"/><text x="119" y="25" text-anchor="middle" class="micro mono">H8</text>
      <rect x="147" width="43" height="41" rx="7" class="block"/><text x="168" y="25" text-anchor="middle" class="micro mono">H9</text>
    </g>
    <path d="M711 517 L753 517" class="wire"/>
    <rect x="761" y="496" width="136" height="43" rx="9" fill="#173d48" stroke="#39d0ba"/>
    <text x="829" y="523" text-anchor="middle" fill="#b8f3e8" font-size="15" font-weight="700">Qwen CUDA</text>
    <path d="M899 517 L933 517" class="wire"/>
    <g class="answer-pulse">
      <rect x="941" y="491" width="191" height="53" rx="10" fill="url(#answer)" stroke="#39d0ba"/>
      <text x="957" y="510" class="micro">answer</text>
      <text x="957" y="533" fill="#8cebdc" font-size="15" font-weight="750" class="mono">KVMEM-7F3A…</text>
    </g>
    <rect x="43" y="457" width="1114" height="100" rx="15" class="focus-ring focus4"/>
  </g>

  <rect x="40" y="580" width="1120" height="34" rx="11" fill="#0f2638" stroke="#2c5268"/>
  <text x="60" y="602" fill="#dceaf2" font-size="15" font-weight="650">Full history stays recoverable. GPU attention uses one bounded, question-selected working set.</text>
</svg>
